; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = waveshare_27078
build_cache_dir = .pio/cache

[env:waveshare_27078]
; platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Target the exact 8MB Flash and 8MB PSRAM hardware layout
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.psram = enabled
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

board_build.app_partition_name = app
board_build.partitions = partitions-8MB-safeboot.csv

; Inject critical ESP32-S3 compiler and hardware flags
build_flags = 
    -std=c++17
  	-std=gnu++17
	; -Wall -Wextra
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  	-D CONFIG_ASYNC_TCP_PRIORITY=10
  	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D BOARD_HAS_PSRAM
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -Wl,-z,noexecstack

;build_src_filter =
;    +<*>
;    ; Force compile LVGL demos and examples, remove when working on your own project
;    +<../.pio/libdeps/${PIOENV}/lvgl/demos>
;    +<../.pio/libdeps/${PIOENV}/lvgl/examples>


build_unflags =
    -std=gnu++11

lib_compat_mode = strict
lib_ldf_mode = chain

; Define project external dependencies
lib_deps = 
    https://github.com/esp-arduino-libs/esp-lib-utils.git
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    lvgl/lvgl @ ^9.6.0
    ESP32Async/AsyncTCP
  	ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson
    mathieucarbou/MycilaESPConnect
    mathieucarbou/MycilaLogger
	mathieucarbou/MycilaConfig
    mathieucarbou/MycilaSystem
    mathieucarbou/MycilaWebSerial
    elims/PsychicMqttClient

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_speed = 921600
upload_protocol = esptool

board_build.embed_files =
 .pio/embed/settings.html.gz

extra_scripts = 
	post:tools/factory.py
	pre:tools/generateui.py
	pre:tools/website.py

custom_safeboot_file = safeboot/safeboot_m5stack-atoms3_2025.11.30.bin
